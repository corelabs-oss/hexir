<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexir: a hexagon split in two — one program partitioned across CPU and GPU -->
  <defs>
    <linearGradient id="cpu" x1="41" y1="28" x2="128" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gpu" x1="128" y1="28" x2="215" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- left half (CPU) with partition-cut zigzag edge -->
  <path d="M121 30 L46 75 L46 181 L121 226 L112 168 L132 128 L112 88 Z" fill="url(#cpu)"/>
  <!-- right half (GPU), mirrored zigzag with a gap = the partition boundary -->
  <path d="M135 30 L210 75 L210 181 L135 226 L126 168 L146 128 L126 88 Z" fill="url(#gpu)"/>

  <!-- CPU core: single solid block -->
  <rect x="68" y="116" width="24" height="24" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- GPU cores: grid of small blocks -->
  <g fill="#FFFFFF" fill-opacity="0.9">
    <rect x="160" y="112" width="9" height="9" rx="2"/>
    <rect x="173" y="112" width="9" height="9" rx="2"/>
    <rect x="160" y="125" width="9" height="9" rx="2"/>
    <rect x="173" y="125" width="9" height="9" rx="2"/>
    <rect x="160" y="138" width="9" height="9" rx="2"/>
    <rect x="173" y="138" width="9" height="9" rx="2"/>
  </g>
</svg>
